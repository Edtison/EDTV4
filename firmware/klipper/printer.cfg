[include mainsail.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 0.0
variable_custom_park_y    : -20.0
variable_custom_park_dz   : 2.0
variable_idle_timeout     : 54000   # 15h = 15*60*60
variable_runout_sensor    : "filament_switch_sensor switch_sensor"   ## If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
gcode:


#Driver7
[stepper_z]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 5
position_max: 650
position_min: -2
homing_speed: 7
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

# Driver6
[stepper_z1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 5

# Driver3
[stepper_y]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
position_endstop: -46
position_min: -46
position_max: 505
homing_speed: 50
endstop_pin: ^PG13
homing_retract_dist: 3

[tmc5160 stepper_y]
cs_pin: PC7
spi_bus: spi1
#diag1_pin: ^!PG11
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999
driver_SGT: 2

# Driver2
[stepper_y1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG12

[tmc5160 stepper_y1]
cs_pin: PC6
spi_bus: spi1
#diag1_pin: ^!PG10
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999
driver_SGT: 2

# Driver5
[stepper_x]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG15
position_endstop:-59.5
position_min: -59.5
position_max: 475
homing_speed: 30
homing_retract_dist: 3

[tmc5160 stepper_x]
cs_pin: PE4
spi_bus: spi1
#diag1_pin: ^!PG13
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999
driver_SGT: 2

# Driver4
[dual_carriage]
axis: x
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG14
position_endstop: 560.29
position_min: 35
position_max: 560.29
homing_speed: 30
homing_retract_dist: 3

[tmc5160 dual_carriage]
cs_pin: PF2
spi_bus: spi1
#diag1_pin: ^!PG12
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999
driver_SGT: 2

#Extruder0 Driver0
[extruder]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 7.824
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PA0 # HE0
sensor_pin:  PF5
sensor_type: ATC Semitec 104GT-2
#sensor_type: PT1000
#control = pid
#pid_kp = 22.310
#pid_ki = 0.953
#pid_kd = 130.512
min_temp: 0
max_temp: 310
pressure_advance: 0.06
#bei 0,4 Nozzle 0,06 verwenden bei pressure_advance!
#bei 0,6 Nozzle 0,04 verwenden bei pressure_advance!
max_extrude_cross_section:250
pressure_advance_smooth_time: 0.020

[tmc2209 extruder]
uart_pin: PC4
#uart_pin: 
run_current: 0.700
hold_current: 0.500
stealthchop_threshold: 999999

[heater_fan fan1]
pin: PA8
heater: extruder 

#Extruder1 Driver1 
[extruder1]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 7.824
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PA3 # HE1
sensor_pin:  PF3 # TB
sensor_type: ATC Semitec 104GT-2
control = pid
pid_kp = 23.801
pid_ki = 1.889
pid_kd = 74.973
min_temp: 0
max_temp: 300
pressure_advance: 0.06
pressure_advance_smooth_time: 0.020

[tmc2209 extruder1]
uart_pin: PD11
#uart_pin: 
run_current: 0.700
hold_current: 0.500
stealthchop_threshold: 999999

#Fan Setup 

[heater_fan fan2]
pin: PD12
heater: extruder1

[multi_pin pinfan]
pins: PE5, PD13

[fan]
pin: multi_pin:pinfan

[fan_generic recirc_fan]
pin: PD15                # dein FAN−-Pin (Beispiel)
hardware_pwm: True
cycle_time: 0.00005      # ~20 kHz  (0.00004 = ~25 kHz, auch gut)
kick_start_time: 1
shutdown_speed: 0.0
max_power: 1.0

[delayed_gcode RECIRC_BOOT]
initial_duration: 1.0       # 1s nach Start ausführen (nicht 0!)
gcode:
  SET_FAN_SPEED FAN=recirc_fan SPEED=0.25

[gcode_macro RECIRC_ON]
gcode:
  SET_FAN_SPEED FAN=recirc_fan SPEED={params.S|default(0.25)|float}

[gcode_macro RECIRC_OFF]
gcode:
  SET_FAN_SPEED FAN=recirc_fan SPEED=0

[gcode_macro RECIRC_INC]
description: Erhöht recirc_fan um STEP (Default 0.25 = 25 %)
variable_step: 0.25
gcode:
  {% set step = params.STEP|default(printer["gcode_macro RECIRC_INC"].step)|float %}
  {% set cur  = printer["fan_generic recirc_fan"].speed|default(0.0)|float %}
  {% set new  = cur + step %}
  {% if new > 1.0 %}{% set new = 1.0 %}{% endif %}
  {% if new < 0.0 %}{% set new = 0.0 %}{% endif %}
  SET_FAN_SPEED FAN=recirc_fan SPEED={new}
  {action_respond_info("recirc_fan: " ~ (cur*100)|round(0)|int ~ "% -> " ~ (new*100)|round(0)|int ~ "%")}

[gcode_macro RECIRC_DEC]
description: Senkt recirc_fan um STEP (Default 0.25 = 25 %)
variable_step: 0.25
gcode:
  {% set step = params.STEP|default(printer["gcode_macro RECIRC_DEC"].step)|float %}
  {% set cur  = printer["fan_generic recirc_fan"].speed|default(0.0)|float %}
  {% set new  = cur - step %}
  {% if new > 1.0 %}{% set new = 1.0 %}{% endif %}
  {% if new < 0.0 %}{% set new = 0.0 %}{% endif %}
  SET_FAN_SPEED FAN=recirc_fan SPEED={new}
  {action_respond_info("recirc_fan: " ~ (cur*100)|round(0)|int ~ "% -> " ~ (new*100)|round(0)|int ~ "%")}

[filament_switch_sensor switch_sensor]
switch_pin: ^PG10
pause_on_runout: False
runout_gcode:
  PAUSE 
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^PG11
detection_length: 2.88 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE 
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted

[probe]
pin: !PC5
x_offset: 0
y_offset: 86
#z_offset: 2.22
samples: 2
speed: 5.0
sample_retract_dist: 2.0
lift_speed: 10

#Printer Kinematics

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1000
max_z_velocity: 30
max_z_accel: 120

[safe_z_home]
home_xy_position: 250,164
speed: 70
z_hop: 10
z_hop_speed: 10

[z_tilt]
z_positions: -92,250
      592,250
points: 30,164
      470,164
speed: 100
horizontal_move_z: 8
retries: 10
retry_tolerance: 0.05

[bed_mesh]
horizontal_move_z: 5
speed: 200
mesh_min: 30, 45 # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 470, 470 # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 9, 9
algorithm: bicubic
scan_overshoot: 5

#Input Shaper Daten from EDT V3: (ONLY FOR INFORMATION; DO NOT USE!)
#[input_shaper]
#shaper_freq_x: 41.4
#shaper_type_x: 2hump_ei
#shaper_freq_y: 24.4
#shaper_type_y: mzv

[input_shaper]
# Intentionally empty

[delayed_gcode init_shaper]
initial_duration: 0.1
gcode:
  SET_DUAL_CARRIAGE CARRIAGE=1
  SET_INPUT_SHAPER SHAPER_TYPE_X=2hump_ei SHAPER_FREQ_X=33 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=17.5
  SET_DUAL_CARRIAGE CARRIAGE=0
  SET_INPUT_SHAPER SHAPER_TYPE_X=2hump_ei SHAPER_FREQ_X=33 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=17.5


#Chamber Heater

[duplicate_pin_override]
Pins: PF4

[heater_generic chamber]
heater_pin: PB0
max_power: 1.0
sensor_type: Generic 3950
sensor_pin: PF4
control: watermark
max_delta: 1.0
min_temp: -100
max_temp: 70
gcode_id: C

[verify_heater chamber]
max_error: 300
check_gain_time: 480
hysteresis: 5
heating_gain: 1

[temperature_fan Innenraum]
pin: PD14
control: watermark 
max_speed: 1
min_speed: 1
target_temp: 25
min_temp: 0
max_temp: 85
sensor_pin: PF4 # TB
sensor_type: Generic 3950

[gcode_macro COOLDOWN]
description: Sets every heating element to 0°C
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0

[gcode_macro M141]
gcode:
   SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S}
   SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Innenraum TARGET=25
   

[gcode_macro M191]
gcode:
   SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S}
   SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Innenraum TARGET={(params.S|float) + 5.0}
   TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={params.S}
   
[gcode_macro SET_Z0]
gcode:
  SET_KINEMATIC_POSITION Z=0

[gcode_macro REFILL]
description: Push a small amount of filament, preserves state
gcode:
    SAVE_GCODE_STATE NAME=refill
    M83
    G1 E{params.L|default(0.5)} F{params.F|default(900)}
    G92 E0
    RESTORE_GCODE_STATE NAME=refill

[gcode_macro RETRACT]
description: Pull back a small amount of filament, preserves state
gcode:
    {% set L = params.L|default(0.5)|float %}
    {% set F = params.F|default(900)|float %}
    SAVE_GCODE_STATE NAME=retract
    M83
    G1 E-{L} F{F}
    G92 E0
    RESTORE_GCODE_STATE NAME=retract


#Movement Macros

[gcode_macro PARK_extruder]
gcode:
    SAVE_GCODE_STATE NAME=park0
    SET_DUAL_CARRIAGE CARRIAGE=0
    G90
    G1 X-57 F6000
    RESTORE_GCODE_STATE NAME=park0

[gcode_macro PARK_extruder1]
gcode:
    SAVE_GCODE_STATE NAME=park1
    SET_DUAL_CARRIAGE CARRIAGE=1
    G90
    G1 X557 F6000
    RESTORE_GCODE_STATE NAME=park1

[gcode_macro T0]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET X=0 Y=0

[gcode_macro T1]
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_GCODE_OFFSET X=0 Y=0.15

[gcode_macro END_PRINT]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Move nozzle away from print while retracting
    G91
    G1 E-1 F300
    PARK_{printer.toolhead.extruder}
    # Raise nozzle by 10mm
    G90
    # Disable steppers
    #M84

[gcode_macro START_PRINT]
gcode:

#M140 S{BED_TEMP}
    # Use absolute coordinates
    G90
    # Home the printer
    
    Homing

    Z_TILT_ADJUST

    BED_MESH_CALIBRATE
    # Move the nozzle near the bed
    G1 Z5 F3000
    # Move the nozzle very close to the bed


[gcode_macro Homing]
gcode:
    Retract_X
    G28 
    SET_DUAL_CARRIAGE CARRIAGE=1
    G0 X558 F3000
    SET_DUAL_CARRIAGE CARRIAGE=0
    G0 X-58 F3000

[gcode_macro Retract_X]
gcode: 
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_KINEMATIC_POSITION SET_HOMED=X=500
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_KINEMATIC_POSITION SET_HOMED=X=0
    G91
    G0 X5 F3000
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_KINEMATIC_POSITION X=500
    SET_DUAL_CARRIAGE CARRIAGE=1
    G0 X-5 F3000
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_KINEMATIC_POSITION CLEAR_HOMED=X
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_KINEMATIC_POSITION CLEAR_HOMED=XYZ
    SET_DUAL_CARRIAGE CARRIAGE=0
    G90
    

#Printer General

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_280030001251333031373837-if00

[heater_bed]
heater_pin: PB11
sensor_pin: PF6 # T2
sensor_type: NTC 100K MGB18-104F39050L32
control = pid
pid_kp = 68.522
pid_ki = 2.769
pid_kd = 423.981
min_temp: 0
max_temp: 130

[gcode_button Hardware_Notaus]
pin: PG6
press_gcode: {action_emergency_stop("Hardware_Notaus")}

[force_move]
enable_force_move: True

